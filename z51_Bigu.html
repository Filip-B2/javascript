<!DOCTYPE html>
<head>
  <title> Sprawdzanie danych Filip </title>
  <meta charset="utf-8">
</head>
<body>
<div style="color:red;font-size:50px;">
  <script language="JavaScript">
    do {
      var liczba1=prompt("n=","");
      var n_big=parsefloat(liczba1);
    }
      while(n_big<0);
if(n_big==0){silnia_big=1;
             document.write
               ("n="+n_big+"<br>"+n_big+"!="+silnia_big);
            }
  if(n_big>0){silnia_big=1;
              for(i_big=1;i_big<=n_big;i_big++)
              { silnia_big=silnia_big*i_big;}
              document.write
                ("n="+n_big+"<br>"+n_big+"!="+silnia_big);
</script>
</div>
</body>
</html>
