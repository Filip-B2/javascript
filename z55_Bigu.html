<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        var a_big = parseInt(prompt("podaj a",""));
        var b_big = parseInt(prompt("podaj b",""));

        for (var j_big = 1; j_big <= b_big; j_big++) {
            document.write("*");
        }
        document.write("<br>");

        var wiersz_big = "*";
        for (var j_big = 1; j_big <= (b_big - 2); j_big++) {
            wiersz_big = wiersz_big + "&nbsp;&nbsp;";
        }
        wiersz_big = wiersz_big + "*";

        for (var i_big = 1; i_big <= (a_big - 2); i_big++) {
            document.write(wiersz_big + "<br>");
        }

        for (var j_big = 1; j_big <= b_big; j_big++) {
            document.write("*");
        }
        document.write("<br>");
    </script>
</head>
<body>
</body>
</html>
