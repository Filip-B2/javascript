<body>
<textarea cols="90" rows="24">
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styl.css">
</head>
<body>
<script type="text/javascript">
  function Pole_bigus(a_bigu, b_bigu) {
    return a_bigu * b_bigu;
  }
  function obwod_bigus(a_bigu, b_bigu) {
    return 2 * (a_bigu + b_bigu);
  }
  function pole() {
    var a_bigu = parseFloat(document.getElementById('a_dana_bigu').value);
    var b_bigu = parseFloat(document.getElementById('b_dana_bigu').value);
    var pole = Pole_bigus(a_bigu, b_bigu);
    document.getElementById("nazwa").innerHTML = "Pole prostokąta = " + pole.toFixed(2) + " cm²";
    document.getElementById('wyprowadz_pole_bigu').value = pole.toFixed(2);
  }
  function obwod() {
    var a_bigu = parseFloat(document.getElementById('a_dana_bigu').value);
    var b_bigu = parseFloat(document.getElementById('b_dana_bigu').value);
    var obw = obwod_bigus(a_bigu, b_bigu);
    document.getElementById("nazwa").innerHTML = "Obwód prostokąta = " + obw.toFixed(2) + " cm";
    document.getElementById('wyprowadz_obwod_bigu').value = obw.toFixed(2);
  }
</script>
  <h1>Wszystko o prostokacie</h1><br><br>
  Podaj długość a: <input type="text" id="a_dana_bigu" value=""> cm<br><br>
  Podaj długość b: <input type="text" id="b_dana_bigu" value=""> cm<br><br>
  <input type="button" name="pole" value="Oblicz pole" onclick="pole()"><br><br>
  <input type="button" name="obw" value="Oblicz obwód" onclick="obwod()"><br><br>
  <div style="color:red;font-size:50px;" id="nazwa"></div>
  <br>
</body>
</html>
</textarea>
